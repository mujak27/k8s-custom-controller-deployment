---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - workloads.example.com
  resources:
  - customdeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - workloads.example.com
  resources:
  - customdeployments/finalizers
  verbs:
  - update
- apiGroups:
  - workloads.example.com
  resources:
  - customdeployments/status
  verbs:
  - get
  - patch
  - update
