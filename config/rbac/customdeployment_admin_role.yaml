# This rule is not used by the project custom-controller-deployment itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over workloads.example.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: custom-controller-deployment
    app.kubernetes.io/managed-by: kustomize
  name: customdeployment-admin-role
rules:
- apiGroups:
  - workloads.example.com
  resources:
  - customdeployments
  verbs:
  - '*'
- apiGroups:
  - workloads.example.com
  resources:
  - customdeployments/status
  verbs:
  - get
